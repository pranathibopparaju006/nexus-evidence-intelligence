name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install "fastapi==0.104.1" "httpx==0.25.2" "python-multipart==0.0.6" "pydantic==2.5.0" "pydantic-settings==2.1.0" "sqlalchemy==2.0.23" "psycopg2-binary==2.9.9" "python-jose[cryptography]==3.3.0" "passlib==1.7.4" "bcrypt==3.2.2" "PyPDF2==3.0.1" "python-docx==1.1.0" "pillow==10.1.0" "pytesseract==0.3.10" "pytest==7.4.3"
      - name: Run settings, upload validation, and upload API tests
        working-directory: backend
        run: python -m pytest -q tests/test_config.py tests/test_upload_validation.py tests/test_ingest_api.py
      - name: Compile backend Python files
        run: python -m compileall -q backend
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
