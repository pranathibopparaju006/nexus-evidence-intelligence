name: Python checks

on:
  push:
  pull_request:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight settings test dependencies
        run: python -m pip install "pydantic==2.5.0" "pydantic-settings==2.1.0" "pytest==7.4.3"
      - name: Run settings and upload validation tests
        working-directory: backend
        run: python -m pytest -q tests/test_config.py tests/test_upload_validation.py
      - name: Compile backend Python files
        run: python -m compileall -q backend
